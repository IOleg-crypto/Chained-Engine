name: CI

on:
  push:
    branches: [main, develop, opengl]
    paths:
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.hpp"
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cxx"
      - "**/*.inl"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.py"
      - "tools/**"
      - "resources/shaders/**"
      - "**/CMakeLists.txt"
      - "**/CMakePresets.json"
      - "cmake/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/format.yml"
      - ".github/workflows/linux.yml"
      - ".github/workflows/windows.yml"
  pull_request:
    branches: [main, develop, opengl]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.hpp"
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cxx"
      - "**/*.inl"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.py"
      - "tools/**"
      - "resources/shaders/**"
      - "**/CMakeLists.txt"
      - "**/CMakePresets.json"
      - "cmake/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/format.yml"
      - ".github/workflows/linux.yml"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  format:
    name: Format Check
    uses: ./.github/workflows/format.yml

  linux:
    name: Linux Builds
    uses: ./.github/workflows/linux.yml
    secrets: inherit

  windows:
    name: Windows Builds
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [format, linux, windows]
    if: always()
    steps:
      - name: Evaluate CI status
        run: |
          echo "Format Check: ${{ needs.format.result }}"
          echo "Linux Builds: ${{ needs.linux.result }}"
          echo "Windows Builds: ${{ needs.windows.result }}"

          if [[ "${{ needs.format.result }}" != "success" ]] || \
             [[ "${{ needs.linux.result }}" != "success" ]] || \
             [[ "${{ needs.windows.result }}" != "success" ]]; then
            echo "CI failed: One or more required workflow jobs did not succeed."
            exit 1
          fi

          echo "All CI workflow jobs passed successfully!"


