name: CI

on:
  push:
    branches: [main, opengl, experimental-opengl]
    paths:
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.hpp"
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cxx"
      - "**/*.inl"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.py"
      - "tools/**"
      - "resources/shaders/**"
      - "**/CMakeLists.txt"
      - "**/CMakePresets.json"
      - "cmake/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/linux.yml"
      - ".github/workflows/windows.yml"
      - ".github/workflows/valgrind.yml"
      - ".github/valgrind.supp"
      - ".github/lsan.supp"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.hpp"
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cxx"
      - "**/*.inl"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.py"
      - "tools/**"
      - "resources/shaders/**"
      - "**/CMakeLists.txt"
      - "**/CMakePresets.json"
      - "cmake/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/linux.yml"
      - ".github/workflows/windows.yml"
      - ".github/workflows/valgrind.yml"
      - ".github/valgrind.supp"
      - ".github/lsan.supp"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      matrix_mode:
        description: 'Build Matrix Mode (fast = PR-speed checks, full = all 10 compiler configurations)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - fast
          - full

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  resolve-mode:
    name: Resolve CI Matrix Mode
    runs-on: ubuntu-latest
    outputs:
      matrix_mode: ${{ steps.set_mode.outputs.matrix_mode }}
    steps:
      - id: set_mode
        run: |
          MANUAL_INPUT="${{ github.event.inputs.matrix_mode }}"
          if [[ -n "$MANUAL_INPUT" && "$MANUAL_INPUT" != "auto" ]]; then
            echo "matrix_mode=$MANUAL_INPUT" >> "$GITHUB_OUTPUT"
            echo "Explicit matrix mode selected: $MANUAL_INPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "matrix_mode=fast" >> "$GITHUB_OUTPUT"
            echo "Pull Request detected -> matrix_mode=fast"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "matrix_mode=full" >> "$GITHUB_OUTPUT"
            echo "Scheduled validation detected -> matrix_mode=full"
            exit 0
          fi

          echo "matrix_mode=fast" >> "$GITHUB_OUTPUT"
          echo "Branch push (${{ github.ref_name }}) detected -> matrix_mode=fast"

  linux:
    name: Linux
    needs: [resolve-mode]
    uses: ./.github/workflows/linux.yml
    with:
      matrix_mode: ${{ needs.resolve-mode.outputs.matrix_mode }}
      run_managed_tests: true
    secrets: inherit

  windows:
    name: Windows
    needs: [resolve-mode]
    uses: ./.github/workflows/windows.yml
    with:
      matrix_mode: ${{ needs.resolve-mode.outputs.matrix_mode }}
      run_managed_tests: false
    secrets: inherit

  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [linux, windows]
    if: always()
    steps:
      - name: Evaluate CI status
        run: |
          echo "Linux Builds: ${{ needs.linux.result }}"
          echo "Windows Builds: ${{ needs.windows.result }}"

          if [[ "${{ needs.linux.result }}" != "success" ]] || \
             [[ "${{ needs.windows.result }}" != "success" ]]; then
            echo "CI failed: One or more required workflow jobs did not succeed."
            exit 1
          fi

          echo "All required CI workflow jobs passed successfully!"
