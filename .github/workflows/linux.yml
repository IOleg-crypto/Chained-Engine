name: Linux

on:
  workflow_call:
    inputs:
      matrix_mode:
        description: 'Matrix mode: fast (Clang Debug ASan) or full (Clang + GCC, Debug + Release)'
        required: false
        default: 'fast'
        type: string

env:
  CI: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NODE_OPTIONS: "--no-deprecation"

jobs:
  setup-matrix:
    name: Setup Linux Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      - id: set_matrix
        run: |
          if [[ "${{ inputs.matrix_mode }}" == "fast" ]]; then
            # Fast CI: Linux Clang Debug with AddressSanitizer & UndefinedBehaviorSanitizer
            echo 'matrix={"include":[{"preset":"linux-clang","compiler":"clang","build_type":"Debug"}]}' >> "$GITHUB_OUTPUT"
          else
            # Full CI: Clang & GCC in both Debug & Release (4 configurations)
            echo 'matrix={"include":[{"preset":"linux-clang","compiler":"clang","build_type":"Debug"},{"preset":"linux-clang","compiler":"clang","build_type":"Release"},{"preset":"linux-gcc","compiler":"gcc","build_type":"Debug"},{"preset":"linux-gcc","compiler":"gcc","build_type":"Release"}]}' >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    name: build (ubuntu-latest, ${{ matrix.build_type }}, ${{ matrix.compiler }})
    needs: [setup-matrix]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ccache
          key: Linux-${{ matrix.preset }}-${{ matrix.build_type }}
          max-size: 5G

      - name: Setup Mold Linker
        uses: rui314/setup-mold@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jinja2

      - name: Install Linux Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            xorg-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev \
            pkg-config libgtk-3-dev libdrm-dev libgbm-dev \
            xvfb libxkbcommon-x11-0 libgl1-mesa-dri mesa-utils

      - name: Setup Linux Compilers
        run: |
          set -euo pipefail
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            sudo apt-get install -y clang-18 clang++-18 libc++-18-dev libc++abi-18-dev lld-18 llvm-18
            echo "CC=clang-18" >> $GITHUB_ENV
            echo "CXX=clang++-18" >> $GITHUB_ENV
          else
            sudo apt-get install -y gcc-13 g++-13
            echo "CC=gcc-13" >> $GITHUB_ENV
            echo "CXX=g++-13" >> $GITHUB_ENV
          fi
          echo "LDFLAGS=-fuse-ld=mold" >> $GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Preflight
        run: |
          set -euo pipefail
          cmake --version
          dotnet --info
          if [[ -n "${CC:-}" ]] && command -v "$CC" >/dev/null 2>&1; then
            "$CC" --version | head -n 1
          fi

      - name: Configure
        run: |
          set -euo pipefail
          BUILD_DIR="build/${{ matrix.preset }}"
          mkdir -p "$BUILD_DIR"

          SANITIZERS_FLAG="OFF"
          if [[ "${{ matrix.build_type }}" == "Debug" ]]; then
            SANITIZERS_FLAG="ON"
          fi

          PYTHON_EXE=$(python -c "import sys; print(sys.executable)")

          cmake --preset ${{ matrix.preset }} \
            -B "$BUILD_DIR" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPython_EXECUTABLE="${PYTHON_EXE}" \
            -DPython3_EXECUTABLE="${PYTHON_EXE}" \
            -DCH_CI=ON \
            -DENABLE_UNITY_BUILD=OFF \
            -DENABLE_SANITIZERS=$SANITIZERS_FLAG \
            -DENABLE_LTO=OFF \
            -DENABLE_PCH=OFF \
            2>&1 | tee "$BUILD_DIR/configure.log"

      - name: Build
        run: |
          set -euo pipefail
          cmake --build "build/${{ matrix.preset }}" --config ${{ matrix.build_type }} --parallel \
            2>&1 | tee "build/${{ matrix.preset }}/build_${{ matrix.build_type }}.log"

      - name: Test (Native C++ CTest)
        run: |
          set -euo pipefail
          BUILD_DIR="${{ github.workspace }}/build/${{ matrix.preset }}"
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export MESA_GL_VERSION_OVERRIDE=4.5
          export LSAN_OPTIONS="suppressions=${{ github.workspace }}/.github/lsan.supp"
          
          xvfb-run -a ctest --test-dir "$BUILD_DIR" -C "${{ matrix.build_type }}" --output-on-failure --timeout 300 --output-junit "$BUILD_DIR/junit_${{ matrix.build_type }}.xml" \
            2>&1 | tee "$BUILD_DIR/ctest_${{ matrix.build_type }}.log"

      - name: Test (Managed C# dotnet)
        run: |
          dotnet test "tests/managed/Chained.Managed.Tests.csproj" --verbosity normal

      - name: Upload Logs & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-${{ matrix.preset }}-${{ matrix.build_type }}-logs
          if-no-files-found: ignore
          path: |
            build/${{ matrix.preset }}/**/*.log
            build/${{ matrix.preset }}/**/junit_*.xml
          retention-days: 7

      - name: Upload Release Binaries
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Linux-${{ matrix.preset }}-Release-executables
          if-no-files-found: ignore
          path: |
            build/${{ matrix.preset }}/bin/Release/ChainedEditor
            build/${{ matrix.preset }}/bin/Release/ChainedDecos
            build/${{ matrix.preset }}/bin/ChainedEditor
            build/${{ matrix.preset }}/bin/ChainedDecos
            build/${{ matrix.preset }}/bin/Release/*.so
            build/${{ matrix.preset }}/bin/*.so
          retention-days: 7