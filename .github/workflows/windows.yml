name: Windows

on:
  workflow_call:
    inputs:
      matrix_mode:
        description: 'Matrix mode: fast (Clang Release) or full (Clang, MSVC, MinGW GCC, Debug + Release)'
        required: false
        default: 'fast'
        type: string
      run_managed_tests:
        description: 'Run the managed test project once for this platform'
        required: false
        default: false
        type: boolean

env:
  CI: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NODE_OPTIONS: "--no-deprecation"

jobs:
  setup-matrix:
    name: Setup Windows Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      - id: set_matrix
        run: |
          if [[ "${{ inputs.matrix_mode }}" == "fast" ]]; then
            # Fast CI: Windows Clang Release
            echo 'matrix={"include":[{"preset":"windows-clang","compiler":"clang","build_type":"Release"}]}' >> "$GITHUB_OUTPUT"
          else
            # Full CI: Clang, MSVC vs2026, and MinGW GCC across Debug & Release (6 configurations)
            echo 'matrix={"include":[{"preset":"windows-clang","compiler":"clang","build_type":"Release"},{"preset":"windows-clang","compiler":"clang","build_type":"Debug"},{"preset":"windows-vs2026","compiler":"vs2026","build_type":"Release"},{"preset":"windows-vs2026","compiler":"vs2026","build_type":"Debug"},{"preset":"windows-gcc","compiler":"gcc","build_type":"Release"},{"preset":"windows-gcc","compiler":"gcc","build_type":"Debug"}]}' >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: build (windows-latest, ${{ matrix.build_type }}, ${{ matrix.compiler }})
    needs: [setup-matrix]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSYS2
        if: "contains(matrix.preset, 'clang') || contains(matrix.preset, 'gcc')"
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: mingw-w64-x86_64-clang lld mingw-w64-x86_64-lld mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-gdb

      - name: Setup MSVC
        if: "contains(matrix.preset, 'msvc') || contains(matrix.preset, 'vs')"
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prefer MSYS2 toolchain over preinstalled MinGW
        if: "contains(matrix.preset, 'clang') || contains(matrix.preset, 'gcc')"
        shell: msys2 {0}
        run: |
          cygpath -w /mingw64/bin >> "$GITHUB_PATH"

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: Windows-${{ matrix.preset }}-${{ matrix.build_type }}
          max-size: 5G

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jinja2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Preflight
        run: |
          set -euo pipefail
          cmake --version
          dotnet --info
          if [[ "${{ matrix.preset }}" == *"clang"* ]]; then
            clang --version | head -n 1
          elif [[ "${{ matrix.preset }}" == *"msvc"* || "${{ matrix.preset }}" == *"vs"* ]]; then
            cl || true
          elif [[ "${{ matrix.preset }}" == *"gcc"* ]]; then
            gcc --version | head -n 1
          fi

      - name: Configure
        run: |
          set -euo pipefail
          SANITIZERS_FLAG="OFF"
          mkdir -p "build/${{ matrix.preset }}"
          PYTHON_EXE=$(python -c "import sys; print(sys.executable)")

          EXTRA_FLAGS=""
          if [[ "${{ matrix.preset }}" == *"clang"* || "${{ matrix.preset }}" == *"gcc"* ]]; then
            EXTRA_FLAGS="-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld"
          fi

          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DPython_EXECUTABLE="${PYTHON_EXE}" \
            -DPython3_EXECUTABLE="${PYTHON_EXE}" \
            -DCH_CI=ON \
            -DENABLE_UNITY_BUILD=OFF \
            -DENABLE_SANITIZERS=$SANITIZERS_FLAG \
            -DENABLE_LTO=OFF \
            -DENABLE_PCH=OFF \
            ${EXTRA_FLAGS} \
            2>&1 | tee "build/${{ matrix.preset }}/configure.log"

      - name: Build
        run: |
          set -euo pipefail
          cmake --build "build/${{ matrix.preset }}" --config ${{ matrix.build_type }} --parallel \
            2>&1 | tee "build/${{ matrix.preset }}/build_${{ matrix.build_type }}.log"

      - name: Diagnose unit test exe exit (temporary debug)
        if: always()
        run: |
          set +e
          BUILD_DIR="build/${{ matrix.preset }}"
          DIAG="$BUILD_DIR/discovery_diag.log"
          EXE="$BUILD_DIR/bin/Release/engine_tests_unit.exe"
          {
            if [[ ! -f "$EXE" ]]; then
              echo "exe not found: $EXE"
              exit 0
            fi
            echo "=== file-redirect run (70s budget) ==="
            cd "$BUILD_DIR/bin"
            ./Release/engine_tests_unit.exe --gtest_list_tests > ../discovery_diag_out.txt 2>&1 &
            PID=$!
            for i in $(seq 70); do
              kill -0 "$PID" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$PID" 2>/dev/null; then
              echo "RESULT: HANG (alive after 70s, no pipe involved)"
              tasklist //FI "PID eq $PID" 2>/dev/null
              taskkill //F //PID "$PID" >/dev/null 2>&1
              kill -9 "$PID" 2>/dev/null
            else
              wait "$PID"
              echo "RESULT: EXITED rc=$?"
            fi
            echo "=== output tail ==="
            tail -8 ../discovery_diag_out.txt
            echo "=== markers ==="
            find . -name discovery_markers.log 2>/dev/null | while read -r m; do
              echo "-- $m"
              cat "$m"
            done
          } > "$DIAG" 2>&1

      - name: Test (Native C++ CTest)
        run: |
          set -euo pipefail
          BUILD_DIR="${{ github.workspace }}/build/${{ matrix.preset }}"
          ctest --test-dir "$BUILD_DIR" -C "${{ matrix.build_type }}" --output-on-failure --timeout 300 --output-junit "$BUILD_DIR/junit_${{ matrix.build_type }}.xml" \
            2>&1 | tee "$BUILD_DIR/ctest_${{ matrix.build_type }}.log"

      - name: Test (Managed C# dotnet)
        if: inputs.run_managed_tests
        run: |
          dotnet test "tests/managed/Chained.Managed.Tests.csproj" --verbosity normal

      - name: Upload Logs & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-${{ matrix.preset }}-${{ matrix.build_type }}-logs
          if-no-files-found: ignore
          path: |
            build/${{ matrix.preset }}/**/*.log
            build/${{ matrix.preset }}/**/junit_*.xml
          retention-days: 7

      - name: Upload Release Binaries
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-${{ matrix.preset }}-Release-executables
          if-no-files-found: ignore
          path: |
            build/${{ matrix.preset }}/bin/Release/*.exe
            build/${{ matrix.preset }}/bin/Release/*.dll
            build/${{ matrix.preset }}/bin/*.exe
            build/${{ matrix.preset }}/bin/*.dll
            build/${{ matrix.preset }}/${{ matrix.build_type }}/*.exe
            build/${{ matrix.preset }}/${{ matrix.build_type }}/*.dll
          retention-days: 7